<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WebAR ArUco Hybrid</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
    #unity-container{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
    #unity-canvas{width:100%;height:100%;background:#000}
    #loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-family:Arial,sans-serif;z-index:10;text-align:center}
    #progress{width:280px;height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:12px}
    #bar{width:0;height:100%;background:#fff}
  </style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div>Loading WebAR ArUco…</div><div id="progress"><div id="bar"></div></div></div>
</div>
<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
  var Module = { onRuntimeInitialized: function(){ window.__opencvReady=true; } };
  var canvas=document.querySelector('#unity-canvas');
  var loading=document.querySelector('#loading');
  var bar=document.querySelector('#bar');
  var buildUrl="Build";
  var config={dataUrl:buildUrl+"/TEST2.data.unityweb",frameworkUrl:buildUrl+"/TEST2.framework.js.unityweb",codeUrl:buildUrl+"/TEST2.wasm.unityweb",streamingAssetsUrl:"StreamingAssets",companyName:"AR Demo",productName:"WebAR ArUco Hybrid",productVersion:"1.0"};
  var script=document.createElement('script');
  script.src=buildUrl+"/TEST2.loader.js";
  script.onload=function(){
    createUnityInstance(canvas,config,function(p){bar.style.width=(100*p)+'%';}).then(function(){loading.style.display='none';}).catch(function(e){loading.innerText=e;});
  };
  document.body.appendChild(script);
</script>
</body>
</html>
